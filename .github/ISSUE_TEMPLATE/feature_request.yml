name: ✨ Feature Request
description: 機能要望・改善提案
labels: ["enhancement"]
body:
  - type: dropdown
    id: app
    attributes:
      label: 対象アプリ
      options:
        - apps/user（ユーザー向けWebアプリ）
        - apps/api（AI Agent API）
        - apps/clipper（Chrome拡張）
        - packages/（共通パッケージ）
        - 新規
        - その他
    validations:
      required: true

  - type: input
    id: notion-task
    attributes:
      label: 関連Notionタスク
      description: 関連するタスクがあれば記載（例：TRMN-123）
      placeholder: TRMN-XXX
    validations:
      required: false

  - type: textarea
    id: user-story
    attributes:
      label: ユーザーストーリー
      description: 誰が・何をしたいか・なぜかを記載してください
      value: |
        **〜として**: （例：採用担当者として）
        **〜したい**: （例：スカウト候補者を一括選定したい）
        **なぜなら**: （例：1人ずつ選定するのは時間がかかるため）
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: 詳細
      description: 具体的な要件や仕様のイメージがあれば記載してください
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 検討した別のアプローチがあれば記載してください
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: 参考資料
      description: Figma、仕様書、参考サイトなどがあればリンクを貼ってください
    validations:
      required: false
