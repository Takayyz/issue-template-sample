name: 🐛 Bug Report
description: バグの報告
labels: ["bug"]
body:
  - type: dropdown
    id: app
    attributes:
      label: 対象アプリ
      options:
        - apps/user（ユーザー向けWebアプリ）
        - apps/api（AI Agent API）
        - apps/clipper（Chrome拡張）
        - packages/（共通パッケージ）
        - その他
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: |
        P0: サービス停止レベル / P1: 主要機能が使えない / P2: 回避策あり / P3: 軽微
      options:
        - P0（緊急）
        - P1（高）
        - P2（中）
        - P3（低）
    validations:
      required: true

  - type: textarea
    id: related-links
    attributes:
      label: 関連リンク
      description: 関連するIssue、PR、ドキュメント、参考資料などのリンクを記載してください
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: バグの概要
      description: 何が起きているかを簡潔に説明してください
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: バグを再現するための手順を記載してください
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
    validations:
      required: true

  - type: dropdown
    id: deploy-env
    attributes:
      label: 環境
      description: バグが発生した環境を選択してください
      options:
        - develop
        - staging
        - production
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: ブラウザ
      description: バグが発生したブラウザを選択してください
      options:
        - Chrome
        - Safari
        - Firefox
        - Edge
        - その他
    validations:
      required: false

  - type: input
    id: browser-version
    attributes:
      label: ブラウザのバージョン
      description: 「その他」を選んだ場合のブラウザ名や、バージョンを補足してください
      placeholder: 例) 120.0.6099.71
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: OS
      description: バグが発生したOSを選択してください
      options:
        - macOS
        - Windows
        - Linux
        - iOS
        - Android
        - その他
    validations:
      required: false

  - type: input
    id: os-version
    attributes:
      label: OSのバージョン
      description: 「その他」を選んだ場合のOS名や、バージョンを補足してください
      placeholder: 例) macOS 14.5 Sonoma
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: スクリーンショット / ログ
      description: 画面キャプチャやエラーログがあれば添付してください
    validations:
      required: false
